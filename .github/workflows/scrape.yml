name: Pindaitren Daily Scrape

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install apify-client firebase-admin python-dotenv pyyaml

      - name: Decode and create service-account.json
        run: |
          echo "${{ secrets.FIREBASE_CRED_BASE64 }}" | base64 --decode > service-account.json
        shell: bash

      - name: Verify file exists
        run: |
          if [ -f service-account.json ]; then
            echo "✅ service-account.json created successfully"
            cat service-account.json | head -c 200
          else
            echo "❌ service-account.json NOT created!"
            exit 1
          fi
        shell: bash

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python save_to_firebase.py

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-logs
          path: |
            *.log
            *.txt
            service-account.json