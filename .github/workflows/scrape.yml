name: Pindaitren Daily Scrape

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install apify-client firebase-admin python-dotenv pyyaml

      - name: Create service-account.json from secret
        run: |
          echo '${{ secrets.FIREBASE_CRED_BASE64 }}' | base64 -d > service-account.json

      - name: Verify service-account.json
        run: |
          ls -la service-account.json
          head -c 100 service-account.json

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python save_to_firebase.py

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-logs
          path: |
            *.log
            *.txt